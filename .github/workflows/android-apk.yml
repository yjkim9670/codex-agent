name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/.signing/codex-workbench-release.jks

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: codex-workbench-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare stable release keystore
        if: >-
          env.ANDROID_KEYSTORE_BASE64 != '' &&
          env.ANDROID_KEYSTORE_PASSWORD != '' &&
          env.ANDROID_KEY_ALIAS != '' &&
          env.ANDROID_KEY_PASSWORD != ''
        run: |
          mkdir -p android/.signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"

      - name: Build signed release APK
        if: >-
          env.ANDROID_KEYSTORE_BASE64 != '' &&
          env.ANDROID_KEYSTORE_PASSWORD != '' &&
          env.ANDROID_KEY_ALIAS != '' &&
          env.ANDROID_KEY_PASSWORD != ''
        run: gradle -p android :app:assembleRelease --stacktrace

      - name: Verify release APK signature
        if: >-
          env.ANDROID_KEYSTORE_BASE64 != '' &&
          env.ANDROID_KEYSTORE_PASSWORD != '' &&
          env.ANDROID_KEY_ALIAS != '' &&
          env.ANDROID_KEY_PASSWORD != ''
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release APK
        if: >-
          env.ANDROID_KEYSTORE_BASE64 != '' &&
          env.ANDROID_KEYSTORE_PASSWORD != '' &&
          env.ANDROID_KEY_ALIAS != '' &&
          env.ANDROID_KEY_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: codex-workbench-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
