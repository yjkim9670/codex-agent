name: Apply Android Process Dashboard patch

on:
  push:
    branches:
      - agent/android-process-dashboard
    paths:
      - .github/workflows/apply-android-process-dashboard.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/android-process-dashboard
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Apply source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          catalog = "android/app/src/main/java/com/yjkim9670/codexworkbench/WorkbenchCatalog.kt"
          replace_once(
              catalog,
              '''data class WorkbenchTarget(\n    val id: String,\n    val name: String,\n    val funnelUrl: String,\n    val tailscaleUrl: String,\n) {''',
              '''data class WorkbenchTarget(\n    val id: String,\n    val name: String,\n    val funnelUrl: String,\n    val tailscaleUrl: String,\n    val isCodexWorkbench: Boolean = true,\n) {''',
          )
          replace_once(
              catalog,
              '''        WorkbenchTarget(\n            id = "dev",\n            name = "Dev Codex Workbench",\n            funnelUrl = "$FUNNEL_ROOT/dev/",\n            tailscaleUrl = "http://$TAILSCALE_HOST:3004/",\n        ),\n    )''',
              '''        WorkbenchTarget(\n            id = "dev",\n            name = "Dev Codex Workbench",\n            funnelUrl = "$FUNNEL_ROOT/dev/",\n            tailscaleUrl = "http://$TAILSCALE_HOST:3004/",\n        ),\n        WorkbenchTarget(\n            id = "process_dashboard",\n            name = "Mac Process Dashboard",\n            funnelUrl = "$FUNNEL_ROOT/",\n            tailscaleUrl = "http://$TAILSCALE_HOST:18000/",\n            isCodexWorkbench = false,\n        ),\n    )''',
          )

          main = "android/app/src/main/java/com/yjkim9670/codexworkbench/MainActivity.kt"
          replace_once(main, 'import android.os.Environment\n', 'import android.os.Environment\nimport android.os.Message\n')
          replace_once(main, 'private const val USER_AGENT_SUFFIX = "CodexWorkbenchAndroid/1.1.8"', 'private const val USER_AGENT_SUFFIX = "CodexWorkbenchAndroid/1.1.9"')
          replace_once(main, 'simpleText("접속할 Workbench와 네트워크 방식을 선택하세요.", 13.5f, COLOR_MUTED, false, Gravity.CENTER)', 'simpleText("접속할 서비스와 네트워크 방식을 선택하세요.", 13.5f, COLOR_MUTED, false, Gravity.CENTER)')
          replace_once(main, '"내부 Tailscale · ${WorkbenchCatalog.TAILSCALE_HOST}:3000~3004"', '"내부 Tailscale · ${WorkbenchCatalog.TAILSCALE_HOST}:3000~3004 · Dashboard :18000"')
          replace_once(main, 'val connect = simpleButton("선택한 Workbench 접속", true)', 'val connect = simpleButton("선택한 서비스 접속", true)')
          replace_once(
              main,
              '''            suppressNextPauseMonitor = true\n            runCatching { requestNotificationPermissionIfNeeded() }\n            runCatching { showWorkbench(target, mode) }''',
              '''            suppressNextPauseMonitor = true\n            if (target.isCodexWorkbench) {\n                runCatching { requestNotificationPermissionIfNeeded() }\n            }\n            runCatching { showWorkbench(target, mode) }''',
          )
          replace_once(
              main,
              '''            javaScriptCanOpenWindowsAutomatically = false\n            setSupportMultipleWindows(false)''',
              '''            javaScriptCanOpenWindowsAutomatically = !target.isCodexWorkbench\n            setSupportMultipleWindows(!target.isCodexWorkbench)''',
          )
          replace_once(
              main,
              '''            override fun onPageFinished(view: WebView?, url: String?) {\n                super.onPageFinished(view, url)\n                runCatching { removeDuplicatedPromptSafeArea(view) }\n                runCatching { enableWorkModeByDefault(view) }\n            }''',
              '''            override fun onPageFinished(view: WebView?, url: String?) {\n                super.onPageFinished(view, url)\n                if (target.isCodexWorkbench) {\n                    runCatching { removeDuplicatedPromptSafeArea(view) }\n                    runCatching { enableWorkModeByDefault(view) }\n                }\n            }''',
          )
          replace_once(
              main,
              '''                    } else {\n                        "Workbench 연결 오류: ${error?.description ?: "unknown error"}"\n                    }''',
              '''                    } else {\n                        val label = if (target.isCodexWorkbench) "Workbench" else "대시보드"\n                        "$label 연결 오류: ${error?.description ?: "unknown error"}"\n                    }''',
          )
          replace_once(
              main,
              '''        browser.webChromeClient = object : WebChromeClient() {\n            override fun onShowFileChooser(''',
              '''        browser.webChromeClient = object : WebChromeClient() {\n            override fun onCreateWindow(\n                view: WebView?,\n                isDialog: Boolean,\n                isUserGesture: Boolean,\n                resultMsg: Message?,\n            ): Boolean {\n                if (target.isCodexWorkbench) return false\n                val transport = resultMsg?.obj as? WebView.WebViewTransport ?: return false\n                val popup = WebView(this@MainActivity).apply {\n                    settings.javaScriptEnabled = true\n                    settings.domStorageEnabled = true\n                    settings.allowFileAccess = false\n                    settings.allowContentAccess = true\n                    webViewClient = object : WebViewClient() {\n                        override fun shouldOverrideUrlLoading(\n                            view: WebView?,\n                            request: WebResourceRequest?,\n                        ): Boolean {\n                            val uri = request?.url ?: return true\n                            val scheme = uri.scheme?.lowercase().orEmpty()\n                            if (scheme == "http" || scheme == "https" || scheme == "mailto" || scheme == "tel") {\n                                openExternal(uri)\n                            }\n                            view?.post { runCatching { view.destroy() } }\n                            return true\n                        }\n                    }\n                }\n                transport.webView = popup\n                resultMsg.sendToTarget()\n                return true\n            }\n\n            override fun onShowFileChooser(''',
          )
          replace_once(
              main,
              '''    private fun startBackgroundCompletionMonitorIfNeeded() {\n        val target = currentTarget ?: return\n        if (webView == null || serverBaseUrl.isBlank() || !notificationsAllowed() || isFinishing) return''',
              '''    private fun startBackgroundCompletionMonitorIfNeeded() {\n        val target = currentTarget ?: return\n        if (!target.isCodexWorkbench) return\n        if (webView == null || serverBaseUrl.isBlank() || !notificationsAllowed() || isFinishing) return''',
          )

          gradle = "android/app/build.gradle.kts"
          replace_once(gradle, 'versionCode = ciVersionCode ?: 10', 'versionCode = ciVersionCode ?: 11')
          replace_once(gradle, 'versionName = "1.1.8"', 'versionName = "1.1.9"')

          service = "android/app/src/main/java/com/yjkim9670/codexworkbench/TaskNotificationService.kt"
          replace_once(service, 'private const val USER_AGENT = "CodexWorkbenchAndroid/1.1.6"', 'private const val USER_AGENT = "CodexWorkbenchAndroid/1.1.9"')

          docs = "docs/android.md"
          replace_once(
              docs,
              '앱 시작 후 다음 5개 Workbench 중 하나를 선택합니다. 기본 선택은 Common TG입니다. 접속 방식은 `Funnel`과 `Tailscale 내부 접속` 두 가지이며, 기본값은 기존과 동일한 Funnel입니다.',
              '앱 시작 후 5개 Codex Workbench 또는 `Mac Process Dashboard`를 선택합니다. 기본 선택은 Common TG입니다. 접속 방식은 `Funnel`과 `Tailscale 내부 접속` 두 가지이며, 기본값은 기존과 동일한 Funnel입니다.',
          )
          replace_once(
              docs,
              '| Dev Codex Workbench | `https://dinya.wind-mintaka.ts.net/dev/` | `http://dinya.wind-mintaka.ts.net:3004/` |',
              '| Dev Codex Workbench | `https://dinya.wind-mintaka.ts.net/dev/` | `http://dinya.wind-mintaka.ts.net:3004/` |\n| Mac Process Dashboard | `https://dinya.wind-mintaka.ts.net/` | `http://dinya.wind-mintaka.ts.net:18000/` |',
          )
          replace_once(
              docs,
              '선택된 URL은 WebView뿐 아니라 same-origin 판정, 인증 cookie, DownloadManager, background completion monitor API에도 동일하게 사용합니다. 따라서 Funnel과 Tailscale 주소가 한 세션에서 섞이지 않습니다. Tailscale direct 연결이 실패하면 앱은 자동으로 Funnel로 전환하지 않고 Tailscale 연결 상태를 확인하거나 Funnel 모드로 전환하라는 안내를 표시합니다.',
              '선택된 URL은 WebView뿐 아니라 same-origin 판정, 인증 cookie, DownloadManager에 동일하게 사용합니다. Codex Workbench에서는 background completion monitor API에도 같은 URL을 사용합니다. 따라서 Funnel과 Tailscale 주소가 한 세션에서 섞이지 않습니다. Tailscale direct 연결이 실패하면 앱은 자동으로 Funnel로 전환하지 않고 Tailscale 연결 상태를 확인하거나 Funnel 모드로 전환하라는 안내를 표시합니다. Mac Process Dashboard는 Codex stream polling 및 Work Mode 주입 대상에서 제외합니다.',
          )
          replace_once(
              docs,
              '- 다운로드는 Android DownloadManager를 사용합니다.',
              '- 다운로드는 Android DownloadManager를 사용합니다.\n- Mac Process Dashboard의 `target="_blank"` / `window.open()` 링크는 dashboard WebView에서 multi-window 요청을 받아 Android 외부 브라우저의 새 창으로 엽니다. Codex Workbench WebView의 기존 popup 정책은 변경하지 않습니다.',
          )
          replace_once(
              docs,
              '현재 Android client source fallback 버전은 `1.1.8` (`versionCode 10`)입니다.',
              '현재 Android client source fallback 버전은 `1.1.9` (`versionCode 11`)입니다.',
          )

          print("Android process dashboard patch applied successfully")
          PY

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Commit validated source changes
        shell: bash
        run: |
          rm -f .github/workflows/apply-android-process-dashboard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(android): add Mac process dashboard access"
          git push origin HEAD:agent/android-process-dashboard
