name: Cleanup merged branches

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-merged-branches.yml"

permissions:
  contents: write

jobs:
  cleanup-merged-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Delete merged remote branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "agent/android-dashboard-inapp-windows"
            "agent/android-process-dashboard"
            "fix/dashboard-browser-startup"
            "fix/dashboard-downloads"
            "fix/s24-download-document-start"
            "fix/s24-download-events"
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done
