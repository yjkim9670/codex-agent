name: Patch server-root navigation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/patch-server-navigation.yml"

permissions:
  contents: write

jobs:
  patch-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply Android navigation changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main_path = Path("android/app/src/main/java/com/yjkim9670/codexworkbench/MainActivity.kt")
          text = main_path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              '        private const val PREFS_NAME = "codex_workbench"\n',
              '        const val EXTRA_SHOW_SERVER_SELECTION = "show_server_selection"\n'
              '        private const val PREFS_NAME = "codex_workbench"\n',
              "navigation intent constant",
          )
          replace_once(
              '            showOpeningScreen(savedId)\n',
              '            showConnectionScreen(savedId)\n',
              "default server selection screen",
          )
          replace_once(
              '    override fun onResume() {\n',
              '''    override fun onNewIntent(intent: Intent?) {
        super.onNewIntent(intent)
        setIntent(intent)
        if (intent?.getBooleanExtra(EXTRA_SHOW_SERVER_SELECTION, false) != true) return
        intent.removeExtra(EXTRA_SHOW_SERVER_SELECTION)
        val savedId = prefs.getString(PREF_WORKBENCH_ID, null) ?: WorkbenchCatalog.DEFAULT_ID
        runCatching { showConnectionScreen(savedId) }
            .onFailure {
                recordCrash(it)
                showRecoveryScreen("연결 화면 오류", formatError(it))
            }
    }

    override fun onResume() {
''',
              "server selection intent handler",
          )

          marker = '        fun addTargetCard(target: WorkbenchTarget) {\n'
          if text.count(marker) != 1:
              raise SystemExit(f"connect helper marker: expected 1 match, found {text.count(marker)}")
          helper = '''        fun connectToTarget(target: WorkbenchTarget) {
            val mode = selectedMode()
            val resolvedUrl = target.urlFor(mode)
            prefs.edit()
                .putString(PREF_WORKBENCH_ID, target.id)
                .putString(PREF_SERVER_URL, resolvedUrl)
                .putBoolean(PREF_USE_TAILSCALE, mode == ConnectionMode.TAILSCALE)
                .apply()
            suppressNextPauseMonitor = true
            if (target.isCodexWorkbench) {
                runCatching { requestNotificationPermissionIfNeeded() }
            }
            runCatching { showWorkbench(target, mode) }
                .onFailure {
                    recordCrash(it)
                    showRecoveryScreen("WebView 시작 오류", formatError(it))
                }
        }

'''
          text = text.replace(marker, helper + marker, 1)

          replace_once(
              '''                setOnClickListener {
                    selectedId = target.id
                    refreshCards()
                }
''',
              '''                setOnClickListener {
                    if (target.isCodexWorkbench) {
                        selectedId = target.id
                        refreshCards()
                    } else {
                        connectToTarget(target)
                    }
                }
''',
              "dashboard immediate connect",
          )

          pattern = re.compile(
              r'        connect\.setOnClickListener \{\n.*?\n        \}\n        settings\.setOnClickListener \{',
              re.S,
          )
          replacement = '''        connect.setOnClickListener {
            connectToTarget(WorkbenchCatalog.byId(selectedId))
        }
        settings.setOnClickListener {'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"connect button refactor: expected 1 match, found {count}")

          replace_once(
              '''    @Deprecated("WebView history behavior")
    override fun onBackPressed() {
        if (settingsOverlay != null) {
            closeSettingsOverlay()
            return
        }
        val browser = webView
        if (browser != null && browser.canGoBack()) browser.goBack() else super.onBackPressed()
    }
''',
              '''    @Deprecated("Server selection is the navigation root")
    override fun onBackPressed() {
        if (settingsOverlay != null) {
            closeSettingsOverlay()
            return
        }
        if (webView != null || currentTarget != null) {
            val selectedId = currentTarget?.id
                ?: prefs.getString(PREF_WORKBENCH_ID, null)
                ?: WorkbenchCatalog.DEFAULT_ID
            showConnectionScreen(selectedId)
            return
        }
        super.onBackPressed()
    }
''',
              "main back navigation",
          )

          text = text.replace('CodexWorkbenchAndroid/1.1.10', 'CodexWorkbenchAndroid/1.1.12')
          main_path.write_text(text)

          dashboard_path = Path("android/app/src/main/java/com/yjkim9670/codexworkbench/DashboardBrowserActivityV2.kt")
          dashboard = dashboard_path.read_text()

          old_toolbar_back = '''        back.setOnClickListener {
            if (webView.canGoBack()) webView.goBack() else finish()
        }
'''
          if dashboard.count(old_toolbar_back) != 1:
              raise SystemExit(f"dashboard toolbar back: expected 1 match, found {dashboard.count(old_toolbar_back)}")
          dashboard = dashboard.replace(
              old_toolbar_back,
              '        back.setOnClickListener { returnToServerSelection() }\n',
              1,
          )

          old_system_back = '''    @Deprecated("WebView history behavior")
    override fun onBackPressed() {
        val current = browser
        if (current != null && current.canGoBack()) current.goBack() else super.onBackPressed()
    }
'''
          if dashboard.count(old_system_back) != 1:
              raise SystemExit(f"dashboard system back: expected 1 match, found {dashboard.count(old_system_back)}")
          new_system_back = '''    private fun returnToServerSelection() {
        startActivity(Intent(this, MainActivity::class.java).apply {
            flags = Intent.FLAG_ACTIVITY_CLEAR_TOP or Intent.FLAG_ACTIVITY_SINGLE_TOP
            putExtra(MainActivity.EXTRA_SHOW_SERVER_SELECTION, true)
        })
        finish()
    }

    @Deprecated("Server selection is the navigation root")
    override fun onBackPressed() {
        returnToServerSelection()
    }
'''
          dashboard = dashboard.replace(old_system_back, new_system_back, 1)
          dashboard = dashboard.replace('CodexWorkbenchAndroid/1.1.10', 'CodexWorkbenchAndroid/1.1.12')
          dashboard_path.write_text(dashboard)

          legacy_dashboard = Path("android/app/src/main/java/com/yjkim9670/codexworkbench/DashboardBrowserActivity.kt")
          legacy_text = legacy_dashboard.read_text().replace(
              'CodexWorkbenchAndroid/1.1.10',
              'CodexWorkbenchAndroid/1.1.12',
          )
          legacy_dashboard.write_text(legacy_text)

          gradle_path = Path("android/app/build.gradle.kts")
          gradle = gradle_path.read_text()
          if 'versionCode = ciVersionCode ?: 13' not in gradle or 'versionName = "1.1.11"' not in gradle:
              raise SystemExit("unexpected Android version values")
          gradle = gradle.replace('versionCode = ciVersionCode ?: 13', 'versionCode = ciVersionCode ?: 14', 1)
          gradle = gradle.replace('versionName = "1.1.11"', 'versionName = "1.1.12"', 1)
          gradle_path.write_text(gradle)
          PY

          git diff --check
          git diff -- android/app/src/main/java/com/yjkim9670/codexworkbench/MainActivity.kt \
            android/app/src/main/java/com/yjkim9670/codexworkbench/DashboardBrowserActivityV2.kt \
            android/app/src/main/java/com/yjkim9670/codexworkbench/DashboardBrowserActivity.kt \
            android/app/build.gradle.kts

      - name: Commit navigation changes
        shell: bash
        run: |
          git config user.name "yjkim9670"
          git config user.email "148088384+yjkim9670@users.noreply.github.com"
          git add android/app/src/main/java/com/yjkim9670/codexworkbench/MainActivity.kt \
            android/app/src/main/java/com/yjkim9670/codexworkbench/DashboardBrowserActivityV2.kt \
            android/app/src/main/java/com/yjkim9670/codexworkbench/DashboardBrowserActivity.kt \
            android/app/build.gradle.kts
          git commit -m "fix(android): make server selection the navigation root"
          git push origin HEAD:main
