name: Patch server-root navigation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/patch-server-navigation.yml"

permissions:
  contents: write

jobs:
  patch-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply Android navigation changes
        run: python3 .github/scripts/patch_server_navigation.py

      - name: Validate patch
        run: git diff --check

      - name: Commit navigation changes
        run: |
          git config user.name "yjkim9670"
          git config user.email "148088384+yjkim9670@users.noreply.github.com"
          git add android/app/src/main/java/com/yjkim9670/codexworkbench/MainActivity.kt android/app/src/main/java/com/yjkim9670/codexworkbench/DashboardBrowserActivityV2.kt android/app/src/main/java/com/yjkim9670/codexworkbench/DashboardBrowserActivity.kt android/app/build.gradle.kts
          git commit -m "fix(android): make server selection the navigation root"
          git push origin HEAD:main
