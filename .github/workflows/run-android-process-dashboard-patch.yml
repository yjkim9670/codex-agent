name: Run Android Process Dashboard patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-android-process-dashboard-patch.yml

permissions:
  contents: write

jobs:
  patch-feature-branch:
    if: github.event.head_commit.message == 'chore: run Android dashboard patch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: agent/android-process-dashboard
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Apply source changes
        run: python3 .github/scripts/apply_android_process_dashboard.py

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Commit validated source changes
        shell: bash
        run: |
          rm -f .github/workflows/apply-android-process-dashboard.yml
          rm -f .github/scripts/apply_android_process_dashboard.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(android): add Mac process dashboard access"
          git push origin HEAD:agent/android-process-dashboard
