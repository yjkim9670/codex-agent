<!doctype html>
<html lang="ko" data-ui-font="ibm-plex">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="chat-csrf" content="{{ csrf }}"><title>Workbench Chat</title><link rel="stylesheet" href="static/css/fonts.css?v=3"><link rel="stylesheet" href="static/css/chat.css?v=8"><script defer src="static/vendor/marked-18.0.6.umd.js"></script><script defer src="static/vendor/dompurify-3.4.12.min.js"></script><script defer src="static/js/transport.js?v=8"></script><script defer src="static/js/chat.js?v=10"></script></head>
<body><div class="shell">
<aside id="sidebar" aria-label="대화 이력"><div class="brand">Workbench <b>Chat</b><button id="close-history" aria-label="대화 목록 닫기">×</button></div><button id="new-chat" class="primary">＋ 새 대화</button><label for="history-query">대화 검색</label><input id="history-query" type="search" placeholder="제목으로 찾기"><nav id="history" aria-label="대화 목록"></nav><div class="account"><details id="account-settings" open><summary>개인 Codex 계정</summary><div class="account-content"><label for="account">개인 Codex 계정</label><select id="account"></select><button id="reload-models">연결·모델 새로고침</button><small id="connection">연결 확인 중</small><small id="transport-status" role="status">암호화 연결 확인 중</small></div></details><details id="usage-settings" open><summary>사용량 · 5시간 / 주간</summary><section id="account-limits" aria-label="계정 사용 한도"><div id="limit-windows"></div><small id="limits-status" role="status">사용 한도 확인 중</small></section></details></div></aside>
<main><header><button id="show-history" aria-label="대화 목록 열기">☰</button><h1 id="title">새 대화</h1><div id="header-actions"><button id="rename">제목 변경</button><button id="delete">삭제</button><button id="usage">사용량</button><button id="preferences">화면 설정</button></div><button id="more-actions" aria-label="대화 메뉴 열기" aria-haspopup="dialog">⋮</button></header>
<div id="thread" tabindex="0" aria-label="대화 내용"><div id="empty"><p class="eyebrow">PERSONAL CONVERSATION</p><h2>어떤 문장을 다듬을까요?</h2><p>영어 번역부터 출처가 있는 검색까지,<br>하나의 대화에서 이어가세요.</p><div class="shortcuts"><button data-mode="translate">영어로 번역</button><button data-mode="proofread">영문 교정</button><button data-mode="search">웹에서 찾아 요약</button><button data-mode="chat">일반 질문</button></div></div><div id="messages"></div></div>
<button id="new-content" hidden>새 내용 ↓</button><div id="status" role="status" aria-live="polite"></div>
<form id="composer"><div class="composer-inner"><button id="request-summary" type="button" aria-haspopup="dialog" aria-label="요청 설정 열기">일반 대화 · 모델 조회 중 ⌄</button><div id="request-options"><div class="toolbar"><label>요청<select id="mode"><option value="chat">일반 대화</option><option value="translate">영어 번역</option><option value="proofread">영문 교정</option><option value="search">웹 검색</option></select></label><label>모델<select id="model" required><option value="">모델 조회 중</option></select></label><label>추론<select id="effort"></select></label><label>검색<select id="search"><option value="auto">자동</option><option value="on">켜기</option><option value="off">끄기</option></select></label></div>
<div id="translation-options" class="toolbar" hidden><label>대상 언어<input id="language" value="영어" maxlength="40"></label><label>톤<select id="tone"><option>자연스럽게</option><option>업무용</option><option>간결하게</option></select></label><label>형식<select id="format"><option>번역만</option><option>번역+설명</option></select></label></div>
</div><div class="input-row"><label class="sr-only" for="message">메시지</label><textarea id="message" rows="1" maxlength="60000" placeholder="원문을 붙여 넣거나 질문하세요…"></textarea><div class="compose-footer"><button type="button" id="stop" hidden>응답 중단</button><button type="submit" class="primary" id="send">전송 ↑</button></div></div></div></form></main></div>
<dialog id="actions-dialog" aria-labelledby="actions-heading"><h2 id="actions-heading">대화 메뉴</h2><div id="mobile-actions"></div><button type="button" data-close-dialog>닫기</button></dialog>
<dialog id="request-dialog" aria-labelledby="request-heading"><div class="sheet-heading"><h2 id="request-heading">요청 설정</h2><button type="button" data-close-dialog aria-label="요청 설정 닫기">닫기</button></div><div id="mobile-options"></div></dialog>
<dialog id="settings-dialog"><form method="dialog"><h2>화면 설정</h2><label>글꼴<select id="font"><option value="ibm-plex">IBM Plex Sans KR</option><option value="suit">SUIT Variable</option><option value="nanum-square">NanumSquare Neo</option><option value="wanted-sans">Wanted Sans</option><option value="line-seed-kr">LINE Seed Sans KR</option><option value="goorm-sans">Goorm Sans</option><option value="paperlogy">페이퍼로지 (Paperlogy)</option><option value="nexon-lv2-gothic">Nexon Lv2 Gothic</option></select></label><label>테마<select id="theme"><option value="system">시스템 설정</option><option value="light">라이트</option><option value="dark">다크</option></select></label><label>UI 배율 <output id="scale-value"></output><input id="scale" type="range" min="80" max="110" step="5"></label><button class="primary">닫기</button></form></dialog>
<dialog id="usage-dialog"><form method="dialog"><h2>사용량</h2><p>선택 계정의 5시간·주간 한도</p><div id="dialog-limits"></div><small id="dialog-limits-status"></small><button type="button" id="refresh-limits">한도 새로고침</button><h3>Chat 누적 토큰</h3><p id="usage-summary"></p><p>한도는 선택 계정 전체 기준이며, 아래 토큰 수는 이 Chat에서 관측한 누적 사용량입니다. 제공되지 않은 한도는 미제공으로 표시합니다.</p><button class="primary">닫기</button></form></dialog>
</body></html>
